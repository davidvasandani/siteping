<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SitePing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="brand">
      <img src="icons/icon-48.png" alt="" width="24" height="24" />
      <strong>SitePing</strong>
    </header>

    <main>
      <p id="site" class="site">&nbsp;</p>

      <label class="switch-row" for="enabled">
        <span>
          <strong>Annotate this page</strong>
          <small id="hint">Shows the SitePing button on the page.</small>
        </span>
        <input id="enabled" type="checkbox" class="switch" disabled />
      </label>

      <section class="recording-box" aria-labelledby="recording-title">
        <strong id="recording-title">Screen recording</strong>
        <small id="recording-hint">Choose feedback on this page. Video only; stops after 2 minutes.</small>
        <select id="recording-feedback" aria-label="Feedback to attach the recording to" disabled></select>
        <div class="recording-row">
          <span id="recording-time" aria-live="polite"></span>
          <button id="recording-toggle" type="button" class="button" disabled>Record</button>
        </div>
      </section>

      <p id="error" class="notice notice-error" role="alert" hidden></p>
      <p id="counts" class="counts">&nbsp;</p>

      <button id="review" type="button" class="button button-primary">Review and export</button>
    </main>

    <footer>
      <small>Everything stays on this computer. <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> toggles SitePing; <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> records.</small>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
