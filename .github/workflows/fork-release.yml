name: Fork Release

# Fork-only (davidvasandani/siteping): the @siteping npm scope belongs to
# upstream, so the fork ships its builds as `npm pack` tarballs attached to
# GitHub releases, installed by URL and pinned by the lockfile's integrity.
# See wiki/fork-releases.md.
#
# A tag `<component>-v<base>-fork.<N>` releases one package: <base> must be the
# version packages/<component>/package.json declares at that tag, and the
# tarball is stamped `<base>-fork.<N>`, a pre-release upstream never publishes.
# Nothing is committed back, so main stays a clean merge of upstream.
#
# Releases are immutable (repository setting + this workflow): an existing
# release is never replaced, so a fix ships as fork.<N+1>.

on:
  push:
    tags:
      - "widget-v*-fork.*"
      - "dashboard-v*-fork.*"
  # Release a tag whose push did not run this workflow (e.g. a tag on a commit
  # that predates this file). Refuses a tag that already has a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. widget-v0.11.0-fork.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository_owner != 'NeosiaNexus' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Parse the tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^(widget|dashboard)-v([0-9]+\.[0-9]+\.[0-9]+)-fork\.([1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not <widget|dashboard>-v<x.y.z>-fork.<N>"
            exit 1
          fi
          component="${BASH_REMATCH[1]}"
          base="${BASH_REMATCH[2]}"
          version="$base-fork.${BASH_REMATCH[3]}"
          {
            echo "component=$component"
            echo "base=$base"
            echo "version=$version"
            echo "asset=siteping-$component-$version.tgz"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; releases are immutable, cut the next fork.<N> instead"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: The tag names the version its source declares
        working-directory: packages/${{ steps.tag.outputs.component }}
        env:
          BASE: ${{ steps.tag.outputs.base }}
        run: |
          declared=$(node -p 'require("./package.json").version')
          if [ "$declared" != "$BASE" ]; then
            echo "::error::$TAG says $BASE but packages/${PWD##*/}/package.json declares $declared"
            exit 1
          fi

      # No caches: a release must not build from a restorable (poisonable) cache.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Build
        run: bunx turbo run build --filter=@siteping/${{ steps.tag.outputs.component }}

      - name: Test
        run: bunx vitest run packages/${{ steps.tag.outputs.component }}

      - name: Pack
        id: pack
        working-directory: packages/${{ steps.tag.outputs.component }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          ASSET: ${{ steps.tag.outputs.asset }}
        run: |
          npm pkg set "version=$VERSION"
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          filename=$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")
          integrity=$(node -p 'require(process.argv[1])[0].integrity' "$RUNNER_TEMP/pack.json")
          if [ "$filename" != "$ASSET" ]; then
            echo "::error::npm pack wrote $filename, expected $ASSET"
            exit 1
          fi
          # Installable outside the monorepo: the packed manifest carries the
          # stamped version and no workspace: specifier npm cannot resolve.
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP" package/package.json
          # shellcheck disable=SC2016 # the program is JavaScript, not shell
          node -e '
            const m = require(process.argv[1]);
            if (m.version !== process.env.VERSION) throw new Error(`packed version ${m.version}`);
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"])
              for (const [name, spec] of Object.entries(m[field] ?? {}))
                if (String(spec).startsWith("workspace:")) throw new Error(`${field}.${name} is ${spec}`);
          ' "$RUNNER_TEMP/package/package.json"
          echo "path=$RUNNER_TEMP/$ASSET" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      # Draft first: an immutable release locks its assets once published, so
      # the tarball is attached while it is still a draft. No --clobber.
      - name: Publish the release
        env:
          COMPONENT: ${{ steps.tag.outputs.component }}
          VERSION: ${{ steps.tag.outputs.version }}
          ASSET: ${{ steps.tag.outputs.asset }}
          ASSET_PATH: ${{ steps.pack.outputs.path }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          url="https://github.com/$GH_REPO/releases/download/$TAG/$ASSET"
          commit=$(git rev-parse HEAD)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Fork build of \`@siteping/$COMPONENT\` $VERSION from \`$commit\`. Not published to npm.

          \`\`\`json
          "@siteping/$COMPONENT": "$url"
          \`\`\`

          | | |
          |---|---|
          | Asset | \`$ASSET\` |
          | Integrity | \`$INTEGRITY\` |

          The lockfile's \`integrity\` must equal the value above. This release is immutable.
          EOF
          gh release create "$TAG" --draft --verify-tag --prerelease \
            --title "@siteping/$COMPONENT $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$ASSET_PATH"
          gh release edit "$TAG" --draft=false
          echo "### $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "$url ($INTEGRITY)" >> "$GITHUB_STEP_SUMMARY"
