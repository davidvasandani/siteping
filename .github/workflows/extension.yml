name: Extension

# Fork-only (davidvasandani/siteping): packages the browser extension in
# apps/extension. Its unit tests run with the rest of the workspace in CI's
# `ci` job and its browser run in CI's `e2e` job; this workflow builds what a
# person installs and proves the Safari half, which only a Mac can.
#
# Each run attaches two artifacts: the Chrome folder ("Load unpacked", or the
# upload for the Chrome Web Store) and an unsigned SitePing.app holding the
# Safari extension. Signing and store publication need the owner's accounts
# and are not done here.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "packages/widget/src/**"
      - "packages/core/src/**"
      - "bun.lock"
      - ".github/workflows/extension.yml"
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "packages/widget/src/**"
      - "packages/core/src/**"
      - "bun.lock"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository_owner != 'NeosiaNexus' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches: these artifacts are what people install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
          no-cache: true

      - run: bun install --frozen-lockfile

      # The extension and the packages it bundles from (core's types, the widget).
      - name: Build
        run: bunx turbo run build --filter=@siteping/extension

      - name: Upload the Chrome build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siteping-extension-chrome
          path: apps/extension/dist/chrome/
          if-no-files-found: error

      - name: Upload the Safari web extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siteping-extension-safari-web
          path: apps/extension/dist/safari/
          if-no-files-found: error
          retention-days: 7

  # Safari only installs a web extension that is part of an app. Apple's
  # converter generates the Xcode project around the build above; compiling
  # it is the check that the manifest and resources are ones Safari accepts.
  safari:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/extension/scripts
            apps/extension/package.json

      - name: Download the Safari web extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: siteping-extension-safari-web
          path: apps/extension/dist/safari

      - name: Convert to an Xcode project
        run: node apps/extension/scripts/safari.mjs

      - name: Build the app (unsigned)
        run: |
          project=$(find apps/extension/dist/safari-xcode -name '*.xcodeproj' -maxdepth 3 | head -n 1)
          if [ -z "$project" ]; then
            echo "::error::the converter produced no Xcode project"
            exit 1
          fi
          scheme=$(xcodebuild -list -json -project "$project" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).project.schemes[0]')
          xcodebuild \
            -project "$project" \
            -scheme "$scheme" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          app=$(find "$RUNNER_TEMP/derived/Build/Products/Release" -name '*.app' -maxdepth 1 | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::xcodebuild produced no app"
            exit 1
          fi
          # The extension Safari loads sits inside the app.
          find "$app" -name '*.appex' -maxdepth 4 | grep -q . || {
            echo "::error::the app holds no Safari extension"
            exit 1
          }
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/SitePing-macos-unsigned.zip"

      - name: Upload the Safari app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siteping-extension-safari-macos-unsigned
          path: ${{ runner.temp }}/SitePing-macos-unsigned.zip
          if-no-files-found: error
